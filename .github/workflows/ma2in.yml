name: Build Granite - Linux

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

jobs:
  build:
    name: "Linux | ${{ matrix.granite_platform }} | ${{ matrix.shared }}"
    
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]
        shared: [OFF, ON]
        granite_platform: [SDL, libretro]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            xorg-dev \
            libpulse-dev \
            libvulkan-dev \
            vulkan-tools

      # ------------------------------------------------------------
      # Internal build
      # ------------------------------------------------------------

      - name: Configure Granite
        working-directory: ${{ github.workspace }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DGRANITE_SHARED=${{ matrix.shared }} \
            -DGRANITE_PLATFORM=${{ matrix.granite_platform }} \
            -DGRANITE_AUDIO=ON \
            -DGRANITE_INSTALL_TARGETS=ON \
            -DGRANITE_INSTALL_EXE_TARGETS=ON

      - name: Build Granite
        working-directory: ${{ github.workspace }}
        run: |
          cmake --build build \
            --config ${{ matrix.build_type }} \
            --parallel 2

      - name: Install Granite
        working-directory: ${{ github.workspace }}
        run: |
          cmake --install build

      # ------------------------------------------------------------
      # Show exactly what CMake installed
      # ------------------------------------------------------------

      - name: Show installed files
        run: |
          echo "=========================================="
          echo "Granite install tree"
          echo "=========================================="

          find "$GITHUB_WORKSPACE/install" \
            -type f \
            -print | sort

      # ------------------------------------------------------------
      # Internal linkage test
      # ------------------------------------------------------------

      - name: Test internal linkage
        if: matrix.granite_platform == 'SDL'
        working-directory: ${{ github.workspace }}/install/bin
        run: |
          ./linkage-test

      # ------------------------------------------------------------
      # External build
      # ------------------------------------------------------------

      - name: Configure external test
        working-directory: ${{ github.workspace }}
        run: |
          cmake -S self-test -B build-self \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/self-install" \
            -DGRANITE_AUDIO=ON \
            -DGRANITE_SHARED=${{ matrix.shared }} \
            -DGRANITE_PLATFORM=${{ matrix.granite_platform }}

      - name: Build external test
        working-directory: ${{ github.workspace }}
        run: |
          cmake --build build-self \
            --config ${{ matrix.build_type }} \
            --parallel 2

      - name: Install external test
        working-directory: ${{ github.workspace }}
        run: |
          cmake --install build-self

      - name: Test external linkage
        working-directory: ${{ github.workspace }}/self-install/bin
        run: |
          ./link-test

      # ------------------------------------------------------------
      # Package library
      # ------------------------------------------------------------

      - name: Package Granite
        run: |
          PACKAGE="granite-linux-${{ matrix.granite_platform }}-${{ matrix.shared }}"

          mkdir -p "package/${PACKAGE}"

          cp -a \
            "$GITHUB_WORKSPACE/install/." \
            "package/${PACKAGE}/"

          echo "=========================================="
          echo "Package contents"
          echo "=========================================="

          find "package/${PACKAGE}" \
            -type f \
            -print | sort

          tar -C package \
            -czf "${PACKAGE}.tar.gz" \
            "${PACKAGE}"

      # ------------------------------------------------------------
      # Upload library + headers + CMake package
      # ------------------------------------------------------------

      - name: Upload Granite package
        uses: actions/upload-artifact@v4
        with:
          name: granite-linux-${{ matrix.granite_platform }}-${{ matrix.shared }}
          path: |
            granite-linux-${{ matrix.granite_platform }}-${{ matrix.shared }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # Upload raw CMake install tree
      # ------------------------------------------------------------

      - name: Upload install tree
        uses: actions/upload-artifact@v4
        with:
          name: granite-install-${{ matrix.granite_platform }}-${{ matrix.shared }}
          path: install/
          if-no-files-found: error
          retention-days: 30
