name: Build Granite - Linux

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Granite platform"
        required: true
        type: choice
        default: SDL
        options:
          - SDL
          - libretro

      shared:
        description: "Build Granite as shared library"
        required: true
        type: choice
        default: OFF
        options:
          - OFF
          - ON

  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches: [master]

jobs:
  build:
    name: "Linux | ${{ inputs.platform || 'SDL' }} | SHARED=${{ inputs.shared || 'OFF' }}"

    runs-on: ubuntu-latest

    env:
      BUILD_TYPE: Release
      GRANITE_PLATFORM: ${{ inputs.platform || 'SDL' }}
      GRANITE_SHARED: ${{ inputs.shared || 'OFF' }}

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ------------------------------------------------------------
      # Linux dependencies
      # ------------------------------------------------------------

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            xorg-dev \
            libpulse-dev \
            libvulkan-dev \
            vulkan-tools

      # ------------------------------------------------------------
      # Build configuration
      # ------------------------------------------------------------

      - name: Show configuration
        run: |
          echo "=========================================="
          echo "Granite Build"
          echo "=========================================="
          echo "Platform : $GRANITE_PLATFORM"
          echo "Shared   : $GRANITE_SHARED"
          echo "Build    : $BUILD_TYPE"
          echo "=========================================="

      # ------------------------------------------------------------
      # Configure
      # ------------------------------------------------------------

      - name: Configure Granite
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DGRANITE_SHARED="$GRANITE_SHARED" \
            -DGRANITE_PLATFORM="$GRANITE_PLATFORM" \
            -DGRANITE_AUDIO=ON \
            -DGRANITE_INSTALL_TARGETS=ON \
            -DGRANITE_INSTALL_EXE_TARGETS=ON

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build Granite
        run: |
          cmake --build build \
            --config "$BUILD_TYPE" \
            --parallel 2

      # ------------------------------------------------------------
      # Install
      # ------------------------------------------------------------

      - name: Install Granite
        run: |
          cmake --install build

      # ------------------------------------------------------------
      # Show output
      # ------------------------------------------------------------

      - name: Show installed files
        run: |
          echo "=========================================="
          echo "Installed files"
          echo "=========================================="

          find "$GITHUB_WORKSPACE/install" \
            -type f \
            -print | sort

      # ------------------------------------------------------------
      # Internal linkage test
      # ------------------------------------------------------------

      - name: Test internal linkage
        if: hashFiles('install/bin/linkage-test') != ''
        working-directory: ${{ github.workspace }}/install/bin
        run: |
          ./linkage-test

      # ------------------------------------------------------------
      # External build
      # ------------------------------------------------------------

      - name: Configure external test
        run: |
          cmake -S self-test -B build-self \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/self-install" \
            -DGRANITE_AUDIO=ON \
            -DGRANITE_SHARED="$GRANITE_SHARED" \
            -DGRANITE_PLATFORM="$GRANITE_PLATFORM"

      - name: Build external test
        run: |
          cmake --build build-self \
            --config "$BUILD_TYPE" \
            --parallel 2

      - name: Install external test
        run: |
          cmake --install build-self

      # ------------------------------------------------------------
      # External linkage test
      # ------------------------------------------------------------

      - name: Test external linkage
        if: hashFiles('self-install/bin/link-test') != ''
        working-directory: ${{ github.workspace }}/self-install/bin
        run: |
          ./link-test

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------

      - name: Package Granite
        run: |
          PACKAGE="granite-linux-${GRANITE_PLATFORM}-shared-${GRANITE_SHARED}"

          mkdir -p "package/$PACKAGE"

          cp -a \
            "$GITHUB_WORKSPACE/install/." \
            "package/$PACKAGE/"

          echo "=========================================="
          echo "Package"
          echo "=========================================="

          find "package/$PACKAGE" \
            -type f \
            -print | sort

          tar -C package \
            -czf "${PACKAGE}.tar.gz" \
            "$PACKAGE"

      # ------------------------------------------------------------
      # Upload library
      # ------------------------------------------------------------

      - name: Upload Granite package
        uses: actions/upload-artifact@v4
        with:
          name: granite-linux-${{ env.GRANITE_PLATFORM }}-shared-${{ env.GRANITE_SHARED }}
          path: |
            granite-linux-${{ env.GRANITE_PLATFORM }}-shared-${{ env.GRANITE_SHARED }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # Upload raw install tree
      # ------------------------------------------------------------

      - name: Upload install tree
        uses: actions/upload-artifact@v4
        with:
          name: granite-linux-${{ env.GRANITE_PLATFORM }}-install-${{ env.GRANITE_SHARED }}
          path: install/
          if-no-files-found: error
          retention-days: 30
